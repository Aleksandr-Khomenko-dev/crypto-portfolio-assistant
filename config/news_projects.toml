# News COVERAGE metadata (public project facts only).
#
# coverage_tier is a NEWS MONITORING PRIORITY, never an investment rating.
#   1 = established, highly liquid networks / core infrastructure
#   2 = meaningful liquidity plus credible backing and ecosystem relevance
# Projects not listed here (tier 3 / micro) are not monitored automatically; they can
# still be linked when an official exchange notice names a symbol with an active setup.
# Portfolio holdings are NEVER listed here: they come from the portfolio database.
#
# Matching rules: `aliases` and `organizations` are matched case-insensitively as whole
# phrases. Tickers in `ambiguous_tickers` (common words) only match as a cashtag ($OP),
# a pair (OPUSDT / OP-USDT), a parenthesised ticker "(OP)" or a provider symbol tag.

version = "2026-09-24"
ambiguous_tickers = [
  "OP", "ONE", "GAS", "SUN", "TIME", "NEAR", "TON", "DOT", "LINK", "UNI", "ATOM",
  "APT", "TIA", "ETC", "SOL", "ADA", "DOGE", "SEI", "FIL", "ICP", "ENS", "SAND",
  "MANA", "FLOW", "ROSE", "GALA", "BLUR", "PEOPLE", "MASK", "HIGH", "ID", "MOVE", "S",
]

